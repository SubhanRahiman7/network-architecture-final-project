name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pbf:
    name: PBF/1 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (warnings are errors) and run the C++ tests
        run: make test
      - name: Interop - independent Python implementations written from SPEC.md
        run: make interop
      - name: HEXDUMP.md is current
        run: make hexdump-check
